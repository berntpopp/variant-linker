version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      production-compatible:
        dependency-type: production
        update-types: [minor, patch]
      development-compatible:
        dependency-type: development
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      documentation-compatible:
        patterns: ['*']
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
